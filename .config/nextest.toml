# Define serial test group for running tests sequentially.
[test-groups]
serial = { max-threads = 1 }

# Run ty file watching tests sequentially to avoid race conditions.
[[profile.default.overrides]]
filter = 'binary(file_watching)'
test-group = 'serial'

[profile.ci]
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate-final"
# Do not cancel the test run on the first failure.
fail-fast = false

status-level = "skip"

# Mark tests that take longer than 1s as slow.
# Terminate after 60s as a stop-gap measure to terminate on deadlock.
slow-timeout =  { period = "1s", terminate-after = 60 }

# Show slow jobs in the final summary
final-status-level = "slow"

# Vauxoo fork: forks run CI on 2-core `ubuntu-latest` runners rather than astral-sh's
# 16-core Depot ones. `ty`'s corpus tests check whole fixture trees; the `f` shard of
# `linter_no_panic` takes ~19s on Depot and goes past the 60s deadlock stop-gap above on
# the smaller runners, so these get three minutes there.
[[profile.ci.overrides]]
filter = 'binary(corpus)'
slow-timeout = { period = "1s", terminate-after = 180 }
