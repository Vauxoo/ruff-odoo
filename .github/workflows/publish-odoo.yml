# Vauxoo fork: build and publish the `ruff-odoo` package to PyPI.
#
# Upstream publishes releases through the cargo-dist generated `release.yml`,
# which also pushes Docker images, WASM builds, crates.io releases, etc. This
# fork only needs PyPI wheels, so this workflow reuses the same reusable
# subworkflows (`build-binaries.yml` + `publish-pypi.yml`) that upstream's
# release pipeline calls, without running cargo-dist or the signing stage.
#
# Trigger: push a 4-component tag like `0.16.2.1` (x.y.z tracks upstream, w is
# Vauxoo's own release counter — see .bumpversion.cfg). No "v" or "odoo-"
# prefix: matches upstream astral-sh/ruff's current bare-version tag style
# (e.g. `0.16.2`, not `v0.16.2`), and since our tags always have 4
# dot-separated components, the `*.*.*.*` pattern can never match one of
# upstream's 3-component tags, so no extra prefix is needed to disambiguate.
#
# Requirements on the Vauxoo/ruff-odoo repository:
#   - A `release` environment (used by publish-pypi.yml).
#   - A PyPI "trusted publisher" for the `ruff-odoo` project configured as:
#     owner `Vauxoo`, repository `ruff-odoo`, workflow `publish-pypi.yml`,
#     environment `release`. The workflow filename must be the *reusable*
#     workflow that runs the upload (publish-pypi.yml), NOT this caller file:
#     PyPI matches the OIDC token's `job_workflow_ref` claim, which GitHub
#     stamps with the called workflow when a job runs via `uses:`.
name: "[ruff-odoo] Release to PyPI"

on:
  push:
    tags:
      - "*.*.*.*"

permissions: {}

jobs:
  build-binaries:
    # The `plan` input is only meaningful when called from cargo-dist; the
    # subworkflow does not read it in any step, so pass an empty string.
    # zizmor prefers `$/`, which actionlint does not parse yet; upstream only writes it in
    # `release.yml`, which prek excludes.
    uses: ./.github/workflows/build-binaries.yml # zizmor: ignore[self-repository]
    with:
      plan: ""
    permissions:
      contents: read
      # uraimo/run-on-arch-action caches its cross-arch containers in the
      # repository's package registry using `github.token`.
      packages: write

  # Upstream's `publish-pypi.yml` uploads one artifact, by ID, that its binary-signing
  # stage assembles from the verified wheels and sdist. This fork does not sign, so the
  # distributions `build-binaries.yml` produced are gathered into that one artifact here.
  collect-distributions:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: pypi
          merge-multiple: true
      - name: "Upload PyPI distributions"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: pypi
          if-no-files-found: error

  pypi-publish:
    needs: collect-distributions
    uses: ./.github/workflows/publish-pypi.yml # zizmor: ignore[self-repository]
    with:
      plan: ""
      artifacts: ${{ needs.collect-distributions.outputs.artifact-id }}
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
