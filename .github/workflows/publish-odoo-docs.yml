# Publish the ODOO/OAPP documentation site to GitHub Pages.
#
# Separate from `publish-docs.yml`, which is upstream's job: that one pushes the full
# Ruff site into the `astral-sh/docs` repository using `secrets.ASTRAL_DOCS_PAT`, a
# secret this fork does not have.
#
# Requires "Settings > Pages > Source: GitHub Actions" to be enabled on the repository.
name: mkdocs-odoo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-odoo-docs
  # Deploying an out-of-date site because two pushes raced is worse than losing an
  # intermediate build, and Pages only ever serves the latest deployment anyway.
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_LTO: "off"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: "Install Rust toolchain"
        run: rustup show
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: 3.13
          activate-environment: true
          version: "0.12.1"
      - name: "Install dependencies"
        run: uv pip install -r docs/requirements.txt
      - name: "Generate docs"
        run: cargo dev generate-odoo-docs
      - name: "Build docs"
        run: mkdocs build --strict -f mkdocs-odoo.yml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-odoo

  deploy:
    name: "deploy"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
