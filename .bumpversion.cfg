[bumpversion]
# x.y.z track upstream astral-sh/ruff's version as of the last sync (see the
# sync-astral-upstream skill) and are set directly to whatever upstream has,
# never bumped by `bump2version` itself. w is Vauxoo's own release counter for
# this fork and keeps incrementing across syncs (it does not reset when x.y.z
# changes) — run `bump2version release` for every ruff-odoo release.
current_version = 0.16.2.0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)\.(?P<release>\d+)
serialize = {major}.{minor}.{patch}.{release}
commit = True
tag = True
sign_tags = True
tag_name = odoo-v{new_version}

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:uv.lock]
search = name = "ruff-odoo"
	version = "{current_version}"
replace = name = "ruff-odoo"
	version = "{new_version}"
