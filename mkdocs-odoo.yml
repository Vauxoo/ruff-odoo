# Documentation site for this fork's ODOO/OAPP rules.
#
# Standalone on purpose: `mkdocs.yml` / `mkdocs.template.yml` build the upstream Ruff
# site and are regenerated by `scripts/generate_mkdocs.py`, so keeping this separate
# means rebasing onto astral-sh/ruff never conflicts with it.
#
# Sources come from `cargo dev generate-odoo-docs`; build with:
#   mkdocs build --strict -f mkdocs-odoo.yml
site_name: ruff-odoo
site_description: Odoo lint rules for Ruff, ported from pylint-odoo and odoo-pre-commit-hooks.
site_author: Vauxoo
site_url: https://vauxoo.github.io/ruff-odoo/
site_dir: site-odoo
docs_dir: docs-odoo
repo_url: https://github.com/Vauxoo/ruff-odoo
repo_name: Vauxoo/ruff-odoo
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - toc:
      anchorlink: true
      anchorlink_class: "toclink"
  - pymdownx.magiclink:
  # `attr_list` is not optional: the generated rule tables carry per-row anchors
  # (`ODOO001 { #ODOO001 }`) and column scopes that render as literal text without it.
  - attr_list:
  - md_in_html:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite:
  - pymdownx.superfences:
plugins:
  - search
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Rules: rules.md
  - Settings: settings.md
  - Preview: preview.md
# One page per rule, reached from the tables in `rules.md` rather than from the nav,
# which would otherwise list all 69 of them.
not_in_nav: |
  /rules/*
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vauxoo/ruff-odoo
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ruff-odoo/
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
