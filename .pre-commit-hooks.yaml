# Vauxoo fork: hook definitions so this repo can be used directly as a
# pre-commit hook repo. Installing from here compiles ruff from source with
# maturin (slow, requires a Rust toolchain); for fast installs use the mirror
# repo https://github.com/vauxoo/ruff-pre-commit, which depends on the
# prebuilt `ruff-odoo` wheels instead.
#
# The hook ids match astral-sh/ruff-pre-commit so consumers can switch between
# upstream and this fork by changing only `repo`/`rev`.
- id: ruff-check
  name: ruff check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"
- id: ruff-format
  name: ruff format
  description: "Run 'ruff format' for extremely fast Python formatting"
  entry: ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"
